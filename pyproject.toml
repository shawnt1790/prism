[project]
name = "prism"
version = "0.1.0"
description = "Tool-output compression framework and evaluation testbed for coding agents"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prism", "prism.policies", "adapters"]
