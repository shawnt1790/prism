policy: filter
params:
  threshold_tokens: 2000   # outputs shorter than this pass through unchanged; tune in pilots
  head_lines: 50
  tail_lines: 50
  keep_patterns: ["error", "fail", "traceback", "assert"]
  context_lines: 2         # lines kept after each matching line (traceback frames)
  max_kept_lines: 100      # cap on matching + context lines between head and tail
  max_line_chars: 300      # longer lines are cut (minified files, one-line JSON)
